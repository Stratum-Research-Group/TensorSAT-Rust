[package]
name = "tensorsat"
version = "0.2.0"
edition = "2021"
authors = ["Stratum Research Group"]
description = "High-performance Rust implementation of the TensorSAT planar tensor-network uncrossing decomposition and linear attention engine"
license = "Apache-2.0"

[dependencies]
num-complex = "0.4"
num-traits = "0.2"
rayon = "1.10"
rand = "0.8"

[[bin]]
name = "benchmark_tensorsat"
path = "src/bin/benchmark.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
